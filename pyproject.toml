[project]
name = "fact-frontier"
version = "0.1.0"
description = "Goal-driven adaptive learning: a growing pool of atomic facts built from what you read"
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.5",
    "numpy>=2.3",
    "openai>=2.0",
    "pydantic>=2.11",
]

[project.scripts]
frontier = "frontier.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "pyright>=1.1.407",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontier"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["frontier", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
